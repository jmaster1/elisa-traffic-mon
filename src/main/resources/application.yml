spring:
  application:
    name: etm
  web:
    resources:
      add-mappings: false
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DATABASE_URL:jdbc:mariadb://localhost:3306/etm}
    username: ${DATABASE_USERNAME:etm}
    password: ${DATABASE_PASSWORD:etm}
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/etm-schema.sql
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  freemarker:
    settings:
      auto_include: _/layout.ftlh
      number_format: computer
    expose-session-attributes: true
    expose-request-attributes: true
    request-context-attribute: request
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

server:
  port: ${SERVER_PORT:8181}
  servlet:
    session:
      timeout: 1d

firebase:
  credentials:
    location: ${ETM_FIREBASE_CREDENTIALS_LOCATION:}
  web:
    api-key: ${ETM_FIREBASE_API_KEY:AIzaSyABw_imts9lDUwAQW1a_je1bRaMljoI6Yg}
    auth-domain: ${ETM_FIREBASE_AUTH_DOMAIN:jmbat-c0b7b.firebaseapp.com}
    project-id: ${ETM_FIREBASE_PROJECT_ID:jmbat-c0b7b}
    storage-bucket: ${ETM_FIREBASE_STORAGE_BUCKET:jmbat-c0b7b.appspot.com}
    messaging-sender-id: ${ETM_FIREBASE_MESSAGING_SENDER_ID:607330370521}
    app-id: ${ETM_FIREBASE_APP_ID:1:607330370521:web:fc46615929d2c974d44fc8}

etm:
  firebase:
    credentials:
      location: ${ETM_FIREBASE_CREDENTIALS_LOCATION:}
  security:
    allowed-emails: timur.kozlov@gmail.com
